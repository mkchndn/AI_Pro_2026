<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini API Fetch Example</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; padding: 8px; }
        button { padding: 10px 20px; cursor: pointer; }
        #output { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 5px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>Ask Gemini</h2>
    <textarea id="promptInput" placeholder="Type your prompt here..."></textarea>
    <button onclick="askGemini()">Send Request</button>

    <h3>Response:</h3>
    <div id="output">AI response will appear here...</div>

    <script>
        // ⚠️ Replace with your actual key from Google AI Studio
        const API_KEY = "AQ.Ab8RN6IAVF8WBom5HE9rwrwaab_SlX1G1EPxl3sT7iWQMHYjXw"; 
        
        // Using the recommended, fast flash model
        const MODEL_NAME = "gemini-2.5-flash"; 

        async function askGemini() {
            const promptText = document.getElementById("promptInput").value;
            const outputDiv = document.getElementById("output");

            if (!promptText.trim()) {
                outputDiv.innerText = "Please enter a prompt first.";
                return;
            }

            outputDiv.innerText = "Thinking...";

            // Construct the REST API endpoint URL
              const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=AQ.Ab8RN6JIcPF0kc2u2eiEff4umrOzcYn_0scytONDitmQo51wzQ";
        
          // alert(url);

            // Prepare the payload structure required by Gemini
            const payload = {
                contents: [{
                    parts: [{ text: promptText }]
                }]
            };

            try {
                // Execute the HTTP POST request using fetch
                const response = await fetch(url, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // Navigate the JSON response object to extract the text output
                const aiResponse = data.candidates[0].content.parts[0].text;
                outputDiv.innerText = aiResponse;

            } catch (error) {
                console.error("API Error:", error);
                outputDiv.innerText = "Error: Failed to fetch response. Check console for details.";
            }
        }
    </script>

</body>
</html>
